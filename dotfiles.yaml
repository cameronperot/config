    optional: true
  - pattern: '^\.julia$'
    optional: true
  - pattern: '^\.juliaup$'
    optional: true
  - pattern: '^\.micromamba$'
    optional: true
  - pattern: '^\.rustup$'
    optional: true
  - pattern: '^\.swt$'
    optional: true
  - pattern: '^\.yarn$'
    optional: true
  - pattern: '^\.config/configstore$'
    optional: true
  - pattern: '^\.config/dconf$'
    optional: true
  - pattern: '^\.config/enchant$'
    optional: true
  - pattern: '^\.config/glib-2\.0$'

# Manifest driving sync_dotfiles.py: syncs dotfiles from $HOME into dotfiles/.
#
# One recursive grammar: every scope has include:/exclude: lists, and any directory
# include entry may carry a nested scope of the same shape, with its lists relative
# to that directory, to any depth.
# - include items: plain strings (literal path or glob, `**` for recursive) or
#   mappings (`path:` plus `optional:`, and for directories a nested
#   `include:`/`exclude:`). A directory with no nested lists syncs as a whole.
# - exclude items: regex with search semantics (anchors control scope), plain
#   strings or mappings (`pattern:` plus `optional:` and `allow_orphan:`). Root
#   excludes match $HOME-relative paths; nested excludes match paths relative
#   to their scope.
# - `optional: true` on an include entry: it may be missing in $HOME (no warning,
#   never pruned). On an exclude: it may match nothing (no unused-pattern warning).
# - `allow_orphan: true` on an exclude: repository copies beneath matching paths
#   are tolerated — never warned about as orphans and never deleted by --prune
#   (the $HOME side stays untracked either way).

secret_patterns:
  # literal quoted assignments only; values starting with $ are shell
  # expansions (env-var pass-throughs), not secrets
  - 'API_KEY\s*=\s*["''](?!\$)[^"'']{8,}["'']'

include:
  - .XCompose
  - .bash_aliases
  - .bash_profile
  - .bashrc
  - .bunfig.toml
  - .gitconfig
  - .inputrc
  - .mamba_init.sh
  - .npmrc
  - .tmux.conf
  - .zsh_plugins.txt
  - .zshenv
  - .zshrc
  # --- agent tooling: selectively curated trees (absent on some machines) ---
  - path: .agent
    optional: true
    include:
      - rules
      - skills
      - prompts
  - path: .omp/agent
    optional: true
    include:
      - AGENTS.md
      - config.yml
      - extensions
    exclude:
      # runtime state, never tracked; repo copies are kept (mounted into the
      # dev container) without orphan warnings or --prune deletion
      - pattern: '^(agent|history|models)\.db(-shm|-wal)?$'
        optional: true
        allow_orphan: true
      - pattern: '^(cache|prompts|sessions|skills|terminal-sessions)$'
        optional: true
        allow_orphan: true
      - pattern: '^last-changelog-version$'
        optional: true
        allow_orphan: true
  - path: .pi/agent
    optional: true
    exclude:
      # runtime state, never tracked; repo copies are kept (mounted into the
      # dev container) without orphan warnings or --prune deletion
      - pattern: '^auth\.json$'
        optional: true
        allow_orphan: true
      - pattern: '^models-store\.json$'
        optional: true
        allow_orphan: true
      - pattern: '^(npm|prompts|sessions|skills|tmp|docs|specs)$'
        optional: true
        allow_orphan: true
      - pattern: '^(read-access|system-prompt)\.log$'
        optional: true
        allow_orphan: true
    include:
      - AGENTS.md
      - guard-rules.json
      - keybindings.json
      - models.json
      - plannotator.json
      - README.md
      - settings.json
      - themes
      - agents
      - path: extensions
        exclude:
          - pattern: 'node_modules'
            optional: true
            allow_orphan: true
          - pattern: 'package-lock\.json$'
            optional: true
            allow_orphan: true

  # --- .config ---
  - path: .config
    include:
      - btop/btop.conf
      - path: Code/User
        include:
          - keybindings.json
          - settings.json
        exclude:
          - pattern: '^History$'
            optional: true
          - pattern: '^chatLanguageModels\.json$'
            optional: true
          - pattern: '^globalStorage$'
            optional: true
          - pattern: '^mcp\.json$'
            optional: true
          - pattern: '^snippets$'
            optional: true
          - pattern: '^sync$'
            optional: true
          - pattern: '^workspaceStorage$'
            optional: true
          - pattern: '^profiles$'
            optional: true
          - pattern: '^.code-profile$'
            optional: true
      - path: environment.d
        optional: true
      - fuzzel/fuzzel.ini
      - gammastep/config.ini
      - htop
      - i3/config
      - i3status-rust
      - kitty/kitty.conf
      - mako/config
      - path: nvim
        optional: true
        include:
          - init.lua
          - init-vscode.lua
          - lua
          - stylua.sh
        exclude:
          - pattern: '^lazy-lock\.json$'
            optional: true
      - pnpm
      - ranger
      - rofi
      - sway/config
      - swaylock/config
      - tmux
      - path: uv
        include:
          - uv.toml
        exclude:
          - pattern: '^uv-receipt\.json$'
            optional: true
      - waybar
      - path: git
        optional: true
        include:
          - ignore
      - path: redshift.conf
        optional: true
      - path: io.datasette.llm
        exclude:
          - pattern: 'logs\.db$'
            optional: true
          - pattern: 'keys\.json$'
            optional: true
          - pattern: 'openrouter_models\.json$'
            optional: true

exclude:
  # --- secrets and credential stores: never tracked ---
  - pattern: '^\.docker$'
    optional: true
  - pattern: '^\.gnupg$'
    optional: true
  - pattern: '^\.pki$'
    optional: true
  - pattern: '^\.pypirc$'
    optional: true
  - pattern: '^\.secret_exports$'
    optional: true
  - pattern: '^\.config/autorestic$'
    optional: true
  - pattern: '^\.config/containers$'
    optional: true
  - pattern: '^\.config/keepassxc$'
    optional: true
  - pattern: '^\.config/rclone$'
    optional: true
  - pattern: '^\.config/signond$'
    optional: true
  - pattern: '^\.config/syncthing$'
    optional: true
  - pattern: '^\.config/tigervnc$'
    optional: true
  # --- histories and caches ---
  - pattern: '^\.VeraCrypt-lock-user$'
    optional: true
  - pattern: '^\.aider\.chat\.history\.md$'
    optional: true
  - pattern: '^\.aider\.input\.history$'
    optional: true
  - pattern: '^\.bash_history$'
    optional: true
  - pattern: '^\.python_history$'
    optional: true
  - pattern: '^\.viminfo$'
    optional: true
  - pattern: '^\.config/\.aider\.chat\.history\.md$'
    optional: true
  - pattern: '^\.config/\.aider\.input\.history$'
    optional: true
  - pattern: '^\.config/\.gsd-keyboard\.settings-ported$'
    optional: true
  # --- restic backup state ---
  - pattern: '^\.restic*'
    optional: true
  # --- toolchains, language runtimes, and package managers ---
